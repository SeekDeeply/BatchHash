name: batchhash
description: BatchHash - cross-platform batch file hashing and verification.
publish_to: 'none'
version: 1.4.0+7

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Capped at <1.8.0 on purpose. From 1.8.0 on, harmonization.dart calls
  # Color.toARGB32(), an API that only exists from Flutter 3.27, while the
  # package's own constraint still says flutter >=3.4. CI pins Flutter 3.24.5,
  # so a caret range (or any range admitting 1.8.x) resolves to a version whose
  # test compilation fails with "The method 'toARGB32' isn't defined".
  # 1.7.0 is the last release that uses the older Color.value API.
  dynamic_color: ">=1.7.0 <1.8.0"
  ffi: ^2.1.3
  file_picker: ^8.1.7
  path_provider: ^2.1.4
  # Desktop window sizing. 0.6.0 requires Flutter >=3.47 and CI pins 3.24.5,
  # so the range stops before it; 0.5.2 declares flutter >=3.3.0 and is the last
  # release that builds there. A caret range would resolve to 0.6.0 and fail.
  window_manager: ">=0.5.0 <0.6.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
