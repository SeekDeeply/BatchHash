name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FLUTTER_VERSION: "3.24.5"

jobs:
  # Keep the three version sources and the CHANGELOG heading in agreement. The
  # script is dependency-free so this job needs nothing but Node.
  verify-versions:
    name: Version / changelog gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify version consistency
        run: node scripts/verify-versions.mjs

  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.check.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: check
        shell: bash
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter=false" >> "$GITHUB_OUTPUT"
          fi

  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  rust-test:
    name: Rust clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # --locked also proves Cargo.lock is in sync with the manifests: a stale
      # lock (for example after adding or removing a dependency) fails here
      # instead of silently resolving to something the release did not test.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked --verbose

  flutter:
    name: Flutter analyze / test
    needs: detect
    if: needs.detect.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: node ../scripts/prepare-app.mjs android,ios,linux,macos,windows
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test --reporter expanded

  bridge:
    name: Bridge (Rust FFI + Dart)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build native library
        run: cargo build -p batchhash-ffi --release --locked
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: node ../scripts/prepare-app.mjs android,ios,linux,macos,windows
      - name: Bridge integration test
        working-directory: app
        env:
          BATCHHASH_FFI_LIB: ${{ github.workspace }}/target/release/libbatchhash_ffi.so
        run: flutter test test/bridge --reporter expanded

  package-native:
    name: Package native library (Linux + Android)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Pinned JDK for the Gradle step below. The hosted runner image moved its
      # default JDK to 25, and Gradle 8.3 aborts with "Unsupported class file
      # major version 69" when it runs on it. Other jobs already pin 17; this one
      # built only Rust libraries until it started assembling an APK, so it had
      # never needed the pin.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Rust (Android targets)
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: |
          node ../scripts/prepare-app.mjs android,linux
      - name: Install cargo-ndk
        # Built from source: the pinned toolchain (1.89.0) satisfies cargo-ndk's
        # MSRV, and this is the path CI has already exercised end to end.
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
      - name: Build Android native libraries
        run: |
          set -e
          cargo ndk -t arm64-v8a -t x86_64 -o app/android/app/src/main/jniLibs \
            build -p batchhash-ffi --release --locked
          find app/android/app/src/main/jniLibs -type f -name '*.so' -print
          test -f app/android/app/src/main/jniLibs/arm64-v8a/libbatchhash_ffi.so
          test -f app/android/app/src/main/jniLibs/x86_64/libbatchhash_ffi.so
      - name: Install GTK toolchain
        # The default `apt-get update` has hung for 20+ minutes on the hosted
        # runners when the mirror is slow, which stalls the whole job with no
        # error to look at. Bounding each attempt and retrying turns an
        # indefinite hang into a fast, visible retry.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # The hosted Ubuntu image points apt at azure.archive.ubuntu.com, which
          # periodically stops answering: every index comes back as `Ign:` and the
          # step then hangs until it is killed. Repointing at the canonical mirror
          # removes the dependency on that host instead of just waiting longer.
          if grep -rq "azure.archive.ubuntu.com" /etc/apt/ 2>/dev/null; then
            sudo sed -i \
              "s|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g" \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          fi
          for attempt in 1 2 3; do
            echo "::group::apt attempt $attempt"
            if sudo apt-get -o Acquire::Retries=3 \
                 -o Acquire::http::Timeout=20 \
                 -o Acquire::https::Timeout=20 \
                 update; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "apt-get update failed on attempt $attempt"
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build Linux bundle with the native library
        run: |
          set -e
          cargo build -p batchhash-ffi --release --locked
          cd app
          flutter build linux --debug
          bundle="build/linux/x64/debug/bundle/lib"
          mkdir -p "$bundle"
          cp ../target/release/libbatchhash_ffi.so "$bundle/"
          test -f "$bundle/libbatchhash_ffi.so"
          ls -la "$bundle" | head -10
      - name: Build Android APK with the native libraries
        run: |
          set -e
          cd app
          flutter build apk --debug
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$apk"
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/libbatchhash_ffi.so'
          unzip -l "$apk" | grep -E 'lib/x86_64/libbatchhash_ffi.so'
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-native-library
          path: |
            target/release/libbatchhash_ffi.so
            app/android/app/src/main/jniLibs
          if-no-files-found: error

  build-linux:
    name: Build Linux (debug)
    needs: [detect, flutter]
    if: needs.detect.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install GTK toolchain
        # The default `apt-get update` has hung for 20+ minutes on the hosted
        # runners when the mirror is slow, which stalls the whole job with no
        # error to look at. Bounding each attempt and retrying turns an
        # indefinite hang into a fast, visible retry.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # The hosted Ubuntu image points apt at azure.archive.ubuntu.com, which
          # periodically stops answering: every index comes back as `Ign:` and the
          # step then hangs until it is killed. Repointing at the canonical mirror
          # removes the dependency on that host instead of just waiting longer.
          if grep -rq "azure.archive.ubuntu.com" /etc/apt/ 2>/dev/null; then
            sudo sed -i \
              "s|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g" \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          fi
          for attempt in 1 2 3; do
            echo "::group::apt attempt $attempt"
            if sudo apt-get -o Acquire::Retries=3 \
                 -o Acquire::http::Timeout=20 \
                 -o Acquire::https::Timeout=20 \
                 update; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "apt-get update failed on attempt $attempt"
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: node ../scripts/prepare-app.mjs linux
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --debug
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-linux-debug
          path: app/build/linux/x64/debug/bundle
          if-no-files-found: error

  build-windows:
    # Compile check only. Deliberately uploads no artifact: a Debug executable
    # links against the Debug CRT (MSVCP140D.dll, VCRUNTIME140D.dll,
    # VCRUNTIME140_1D.dll, ucrtbased.dll), which cannot legally be shipped and
    # does not exist on any normal Windows machine. A downloadable Debug zip was
    # mistaken for a release and failed at startup with exactly that missing-DLL
    # dialog, so the Windows artifact users can get is now release-only (see
    # release.yml). Do not add upload-artifact back to this job.
    name: Build Windows (debug compile check)
    needs: [detect, flutter]
    if: needs.detect.outputs.flutter == 'true'
    # windows-latest recently moved to the windows-2025-vs2026 image (VS 18).
    # Flutter 3.24.5 maps only VS 17 to its "Visual Studio 17 2022" CMake
    # generator and sends every other major version to "Visual Studio 16 2019",
    # which no longer exists on that image, so the build dies with "could not
    # find any instance of Visual Studio". windows-2022 ships VS 17.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: node ../scripts/prepare-app.mjs windows
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --debug
      - name: Assert the compile check produced a runner
        shell: pwsh
        # No artifact is uploaded here on purpose (see the job comment). This
        # step only proves the build really linked something, so a silently
        # skipped build cannot pass as a green compile check.
        run: |
          $exe = "app/build/windows/x64/runner/Debug/batchhash.exe"
          if (-not (Test-Path $exe)) { throw "expected $exe; the Windows debug build produced no runner" }

  build-macos:
    name: Build macOS (debug)
    needs: [detect, flutter]
    if: needs.detect.outputs.flutter == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: node ../scripts/prepare-app.mjs macos
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --debug
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-macos-debug
          path: app/build/macos/Build/Products/Debug
          if-no-files-found: error

  build-ios:
    name: Build iOS simulator (debug, no codesign)
    needs: [detect, flutter]
    if: needs.detect.outputs.flutter == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: node ../scripts/prepare-app.mjs ios
      - name: Build iOS simulator
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --debug --simulator --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-ios-simulator-debug
          path: app/build/ios/iphonesimulator
          if-no-files-found: error

  build-android:
    name: Build Android APK (debug)
    needs: [detect, flutter]
    if: needs.detect.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: node ../scripts/prepare-app.mjs android
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-android-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
