name: Release check

# Verifies that release-profile artifacts actually contain the Rust core before a
# version tag is pushed. Dispatch it, then read the job log; the same steps run
# inside release.yml when a v* tag is created.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-release:
    name: Linux release bundle + native library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install GTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@d92bbbb03544f480ed5c7ba4b54020e4ed2c4f65 # 1.89.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: |
          node ../scripts/prepare-app.mjs linux
      - name: Build the Rust core
        # `--locked`: this job checks the release build, so it must fail on a
        # stale lockfile exactly like the real release does, instead of quietly
        # updating it and passing.
        run: cargo build -p batchhash-ffi --release --locked
      - name: Build release
        working-directory: app
        run: flutter build linux --release
      - name: Bundle and verify the native library
        run: |
          set -e
          bundle="app/build/linux/x64/release/bundle/lib"
          mkdir -p "$bundle"
          cp target/release/libbatchhash_ffi.so "$bundle/"
          test -f "$bundle/libbatchhash_ffi.so"
          tar -czf /tmp/BatchHash-linux-check.tar.gz -C app/build/linux/x64/release/bundle .
          tar -tzf /tmp/BatchHash-linux-check.tar.gz | grep 'lib/libbatchhash_ffi.so'
          echo "release bundle contains the Rust core"

  android-release:
    name: Android release artifacts + native library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install Rust (stable, Android targets)
        uses: dtolnay/rust-toolchain@d92bbbb03544f480ed5c7ba4b54020e4ed2c4f65 # 1.89.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Generate scaffolding, app id and icons
        working-directory: app
        run: |
          node ../scripts/prepare-app.mjs android
      - name: Build the Rust core for Android
        run: |
          set -e
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o app/android/app/src/main/jniLibs build -p batchhash-ffi --release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "app/android/app/src/main/jniLibs/$abi/libbatchhash_ffi.so"
          done
      - name: Build release artifacts
        working-directory: app
        run: |
          flutter build appbundle --release
          flutter build apk --release --split-per-abi
      - name: Verify the native library is packaged
        run: |
          set -e
          # Each split APK must carry the library for its own ABI; a missing
          # library would silently fall back to the fake service at runtime.
          unzip -l app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -E 'lib/arm64-v8a/libbatchhash_ffi.so'
          unzip -l app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            | grep -E 'lib/armeabi-v7a/libbatchhash_ffi.so'
          unzip -l app/build/app/outputs/flutter-apk/app-x86_64-release.apk \
            | grep -E 'lib/x86_64/libbatchhash_ffi.so'
          unzip -l app/build/app/outputs/bundle/release/app-release.aab | grep -E 'lib/arm64-v8a/libbatchhash_ffi.so'
          echo "release artifacts contain the Rust core"
