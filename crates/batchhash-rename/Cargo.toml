[package]
name = "batchhash-rename"
description = "BatchHash suffix, rename planner/executor and SQLite rename log store with cross-session undo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
batchhash-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rusqlite = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.159"

# Windows has no renameat2 equivalent in std: `std::fs::rename` maps to
# MoveFileExW *with* MOVEFILE_REPLACE_EXISTING, so it silently overwrites. The
# raw call is the only way to ask for the non-replacing behaviour.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = { workspace = true }
