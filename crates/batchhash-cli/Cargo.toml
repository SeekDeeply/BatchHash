[package]
name = "batchhash-cli"
description = "BatchHash developer CLI: thin adapter over batchhash-core for CI smoke coverage and debugging. Never used for distribution builds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
batchhash-core = { workspace = true }
batchhash-types = { workspace = true }
batchhash-hash = { workspace = true }
batchhash-report = { workspace = true }
batchhash-rename = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "batchhash"
path = "src/main.rs"
