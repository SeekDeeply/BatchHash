name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The workflow itself only needs to read the repository. The single job that
# writes to the GitHub Releases API is `publish`, which opts in explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.89.0"

jobs:
  # Refuse to build artifacts whose version disagrees with the tag, the
  # workspace Cargo version, app/pubspec.yaml or the CHANGELOG.
  versions:
    name: Version / changelog gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify version consistency
        run: node scripts/verify-versions.mjs

  android:
    name: Android bundle + APK
    needs: [versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Job-level env so the signing step can test for the secret: the secrets
    # context is not reliably available in a step-level `if`.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Rust (Android targets)
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        # Built from source: the pinned toolchain (1.89.0) satisfies cargo-ndk's
        # MSRV, and this is the path CI has already exercised end to end.
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
      - name: Generate platform scaffolding
        working-directory: app
        run: |
          flutter create --platforms=android --project-name batchhash .
          flutter pub get
      - name: Build the Rust core for Android
        run: |
          set -e
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o app/android/app/src/main/jniLibs build -p batchhash-ffi --release --locked
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "app/android/app/src/main/jniLibs/$abi/libbatchhash_ffi.so"
          done
      # Only when the signing secrets exist. The keystore and key.properties go
      # into app/android/, which is the Gradle rootProject directory, so
      # rootProject.file("key.properties") resolves to app/android/key.properties.
      - name: Configure Android release signing (when secrets are present)
        id: signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/upload-keystore.jks
          test -s app/android/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          node scripts/patch-android-signing.mjs app/android
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build release
        working-directory: app
        run: |
          flutter build appbundle --release
          flutter build apk --release --split-per-abi
      # A "release" APK that is still signed with the debug key is the failure
      # this step exists to catch; without the secrets it is expected and the
      # step does not run at all.
      - name: Assert release APKs are not debug-signed
        if: ${{ steps.signing.outputs.configured == 'true' }}
        run: |
          set -e
          build_tools="$ANDROID_SDK_ROOT/build-tools"
          latest=$(ls "$build_tools" | sort -V | tail -1)
          apksigner="$build_tools/$latest/apksigner"
          test -x "$apksigner" || { echo "apksigner not found at $apksigner"; exit 1; }
          for apk in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "checking $apk"
            certs="$("$apksigner" verify --print-certs "$apk")"
            if printf '%s' "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error file=$apk::release APK is signed with the Android debug key"
              exit 1
            fi
            printf '%s' "$certs" | grep -q 'Signer #1'
          done
      - name: Verify the native library is packaged
        run: |
          set -e
          # Each split APK must carry the library for its own ABI; a missing
          # library would silently fall back to the fake service at runtime.
          unzip -l app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -E 'lib/arm64-v8a/libbatchhash_ffi.so'
          unzip -l app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            | grep -E 'lib/armeabi-v7a/libbatchhash_ffi.so'
          unzip -l app/build/app/outputs/flutter-apk/app-x86_64-release.apk \
            | grep -E 'lib/x86_64/libbatchhash_ffi.so'
          unzip -l app/build/app/outputs/bundle/release/app-release.aab | grep -E 'lib/arm64-v8a/libbatchhash_ffi.so'
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/app/outputs/bundle/release/app-release.aab dist/ || true
          cp app/build/app/outputs/flutter-apk/app-*-release.apk dist/ || true
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-android-release
          path: dist/*
          if-no-files-found: error

  # iOS release is deliberately not functional yet: the Rust static library is
  # built, but it is not linked into the Runner target, so a "release" IPA would
  # silently fall back to demo data. This job fails loudly instead of shipping it.
  ios:
    name: iOS (release gate)
    needs: [versions]
    if: vars.ENABLE_IOS_RELEASE == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Apple signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ] || [ -z "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::ENABLE_IOS_RELEASE is true but the Apple signing secrets are absent"
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Rust (iOS targets)
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Generate platform scaffolding
        working-directory: app
        run: |
          flutter create --platforms=ios --project-name batchhash .
          flutter pub get
      - name: Build the Rust core (static library)
        run: |
          set -e
          cargo build -p batchhash-ffi --release --locked --target aarch64-apple-ios
          cargo build -p batchhash-ffi --release --locked --target aarch64-apple-ios-sim
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-ios/release/libbatchhash_ffi.a \
            target/aarch64-apple-ios-sim/release/libbatchhash_ffi.a \
            -output dist/libbatchhash_ffi-fat.a
          ls -lh dist
      - name: Enforce the iOS release gate
        run: |
          echo "::error::the Rust static library is built but not linked into the iOS Runner target; a release IPA would fall back to demo data. See docs/native-packaging.md."
          exit 1

  # Diagnostic only: an unsigned device build proves the Flutter side compiles.
  # It is not a release artifact and creates no Release.
  ios-unsigned:
    name: iOS unsigned (diagnostic)
    if: vars.ENABLE_IOS_UNSIGNED == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Rust (iOS targets)
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: aarch64-apple-ios
      - name: Generate platform scaffolding
        working-directory: app
        run: |
          flutter create --platforms=ios --project-name batchhash .
          flutter pub get
      - name: Build unsigned
        working-directory: app
        run: |
          set -e
          flutter build ios --release --no-codesign
          mkdir -p ../dist
          cd build/ios/iphoneos
          zip -qr ../../../dist/BatchHash-ios-unsigned.zip Payload
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-ios-unsigned-diagnostic
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: [versions]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Generate platform scaffolding
        working-directory: app
        run: |
          flutter create --platforms=macos --project-name batchhash .
          flutter pub get
      - name: Build the Rust core
        run: cargo build -p batchhash-ffi --release --locked
      - name: Build release
        working-directory: app
        run: flutter build macos --release
      - name: Bundle the native library
        run: |
          set -e
          app_path=$(ls -d app/build/macos/Build/Products/Release/*.app | head -1)
          frameworks="$app_path/Contents/Frameworks"
          mkdir -p "$frameworks"
          cp target/release/libbatchhash_ffi.dylib "$frameworks/"
          test -f "$frameworks/libbatchhash_ffi.dylib"
          # Ad-hoc signature only: no Developer ID, no notarisation. Gatekeeper
          # will warn on first launch. See docs/release-checklist.md.
          codesign --force --verbose=2 --sign - "$frameworks/libbatchhash_ffi.dylib"
      - name: Package
        run: |
          set -e
          mkdir -p dist
          cd app/build/macos/Build/Products/Release
          app_bundle=$(ls -d *.app | head -1)
          echo "packaging $app_bundle"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$GITHUB_WORKSPACE/dist/BatchHash-macos.zip"
          cd "$GITHUB_WORKSPACE"
          ls -lh dist
          unzip -l dist/BatchHash-macos.zip | grep 'Contents/Frameworks/libbatchhash_ffi.dylib'
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-macos-release
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows
    needs: [versions]
    # windows-latest recently moved to the windows-2025-vs2026 image (VS 18).
    # Flutter 3.24.5 maps only VS 17 to its "Visual Studio 17 2022" CMake
    # generator and sends every other major version to "Visual Studio 16 2019",
    # which no longer exists on that image, so the build dies with "could not
    # find any instance of Visual Studio". windows-2022 ships VS 17.
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Generate platform scaffolding
        working-directory: app
        run: |
          flutter create --platforms=windows --project-name batchhash .
          flutter pub get
      - name: Build the Rust core
        run: cargo build -p batchhash-ffi --release --locked
      - name: Build release
        working-directory: app
        run: flutter build windows --release
      - name: Bundle the native library
        shell: pwsh
        run: |
          $release = "app/build/windows/x64/runner/Release"
          Copy-Item "target/release/batchhash_ffi.dll" -Destination $release
          if (-not (Test-Path "$release/batchhash_ffi.dll")) { throw "batchhash_ffi.dll is missing" }
          Get-ChildItem $release | Select-Object -First 10 Name
      # A Windows package that links the Debug CRT (MSVCP140D.dll and friends)
      # cannot run on a machine without Visual Studio, and shipping those DLLs is
      # not permitted. So: copy the official release CRT next to the app, then
      # prove by inspection that nothing in the package reaches for a debug CRT
      # and that every MSVC runtime the binaries do need is actually present.
      - name: Ship the release CRT and reject debug CRT dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path "app/build/windows/x64/runner/Release").Path
          if (-not (Test-Path $release)) { throw "release output directory is missing" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found at $vswhere" }
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath |
            Select-Object -First 1
          if (-not $vsPath) { throw "no Visual Studio installation with the C++ x64 build tools" }
          Write-Host "visual studio: $vsPath"

          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vsPath" }
          Write-Host "dumpbin: $($dumpbin.FullName)"

          # Two filters matter here, and both are easy to get wrong:
          #
          # * The redist tree holds a desktop x64 CRT and a onecore\x64 one whose
          #   path also matches '\\x64\\'. OneCore is the UWP/minimal-API-set
          #   variant; bundling it into a desktop app is the wrong runtime, so
          #   exclude it explicitly instead of letting the sort decide.
          # * Sort by the parsed version, not as text: "14.9" sorts above "14.44"
          #   as a string, which would bundle an older CRT than the toolchain
          #   that produced the binaries.
          $candidates = @(Get-ChildItem -Path (Join-Path $vsPath "VC\Redist\MSVC") -Recurse -Directory `
            -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch '\\onecore\\' })
          if ($candidates.Count -eq 0) { throw "no desktop x64 CRT redistributable under $vsPath\VC\Redist\MSVC" }
          Write-Host "desktop x64 CRT candidates: $($candidates.Count)"
          $crtDir = $candidates |
            Sort-Object -Property @{ Expression = {
                $versionText = Split-Path (Split-Path $_.FullName -Parent) -Leaf
                try { [version]$versionText } catch { [version]'0.0' }
              } } -Descending |
            Select-Object -First 1
          if ($crtDir.FullName -match '\\onecore\\') {
            throw "selected a onecore CRT by mistake: $($crtDir.FullName)"
          }
          Write-Host "release CRT: $($crtDir.FullName)"

          # Only release CRT: drop any name carrying the debug D marker, so a
          # mis-selected redistributable can never ship debug binaries.
          $copied = @(Get-ChildItem -Path $crtDir.FullName -Filter *.dll -File |
            Where-Object { $_.Name -notmatch '(?i)(vcruntime[0-9_]*d|msvcp[0-9]*d|concrt[0-9]*d|ucrtbased|msvcrtd)\.dll$' })
          if ($copied.Count -eq 0) { throw "the CRT redistributable directory contains no DLLs" }
          foreach ($dll in $copied) { Copy-Item $dll.FullName -Destination $release -Force }
          Write-Host "bundled CRT DLLs: $(($copied | ForEach-Object Name) -join ', ')"
          # The binaries must reach these by name; a package that bundles the CRT
          # but leaves every exe/dll statically linked proves nothing about the
          # clean-machine case, so assert a real dynamic link exists.
          $vtRuntime = Get-ChildItem -Path $release -Filter "vcruntime140*.dll" -File
          if (-not $vtRuntime) { throw "vcruntime140.dll was not bundled" }

          $binaries = @(Get-ChildItem -Path $release -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' })
          if (-not $binaries) { throw "no executables or DLLs to inspect in $release" }

          $debugPattern = '(?i)^(msvcp|vcruntime|concrt)[0-9_]*[a-z]*d(_?[0-9]+)?\.dll$|^(ucrtbased|msvcrtd)\.dll$'
          $runtimePattern = '(?i)^(msvcp|vcruntime|concrt)[0-9_]+\.dll$'

          $bad = @()
          $unbundled = @()
          foreach ($binary in $binaries) {
            $output = & $dumpbin.FullName /nologo /dependents $binary.FullName 2>&1
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $($binary.Name): $output" }
            $deps = @($output | ForEach-Object {
              if ($_ -match '^\s+([A-Za-z0-9_.\-]+\.dll)\s*$') { $Matches[1] }
            } | Where-Object { $_ })
            Write-Host "$($binary.Name): $($deps.Count) dependencies"
            foreach ($dep in $deps) {
              if ($dep -match $debugPattern) {
                $bad += "$($binary.Name) -> $dep"
              } elseif ($dep -match $runtimePattern) {
                if (-not (Test-Path (Join-Path $release $dep))) {
                  $unbundled += "$($binary.Name) -> $dep"
                }
              }
            }
          }

          # Join the details into a variable first. Inside a subexpression the
          # PowerShell parser is in expression mode, where a backtick escape is
          # invalid, so joining inline in the throw is a ParserError, not a
          # message -- which is how this gate first failed to run at all.
          if ($bad.Count -gt 0) {
            $detail = $bad -join "`n"
            throw "debug CRT dependencies found (these cannot be shipped):`n$detail"
          }
          if ($unbundled.Count -gt 0) {
            $detail = $unbundled -join "`n"
            throw "MSVC runtime dependencies missing from the package:`n$detail"
          }
          Write-Host "no debug CRT dependency, and every MSVC runtime dependency is bundled"
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath dist/BatchHash-windows.zip
          # Inspect the real archive with .NET rather than shelling out to tar,
          # so the check does not depend on which bsdtar the runner ships.
          # ZipFile lives in the shared framework on PowerShell 7; Add-Type is
          # only a fallback for hosts where the type is not preloaded, and must
          # never fail the step on its own.
          try { Add-Type -AssemblyName System.IO.Compression.FileSystem -ErrorAction Stop } catch { }
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/BatchHash-windows.zip").Path)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName)
          } finally {
            $zip.Dispose()
          }
          Write-Host "zip entries: $($entries.Count)"

          foreach ($required in 'batchhash.exe', 'batchhash_ffi.dll', 'flutter_windows.dll') {
            if (-not ($entries | Where-Object { $_ -match [regex]::Escape($required) + '$' })) {
              throw "$required is missing from the release zip"
            }
          }
          $debugInZip = @($entries | Where-Object { $_ -match '(?i)(vcruntime[0-9_]*d|msvcp[0-9]*d|ucrtbased)\.dll$' })
          if ($debugInZip.Count -gt 0) {
            throw "debug CRT leaked into the release zip: $($debugInZip -join ', ')"
          }
          $crtInZip = @($entries | Where-Object { $_ -match '(?i)(vcruntime140|msvcp140)\.dll$' })
          if ($crtInZip.Count -eq 0) {
            throw "the release zip carries no MSVC runtime; it would fail on a clean Windows machine"
          }
          Write-Host "release zip verified: $($crtInZip -join ', ')"
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-windows-release
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux
    needs: [versions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install GTK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Generate platform scaffolding
        working-directory: app
        run: |
          flutter create --platforms=linux --project-name batchhash .
          flutter pub get
      - name: Build the Rust core
        run: cargo build -p batchhash-ffi --release --locked
      - name: Build release
        working-directory: app
        run: flutter build linux --release
      - name: Bundle the native library
        run: |
          set -e
          bundle="app/build/linux/x64/release/bundle/lib"
          mkdir -p "$bundle"
          cp target/release/libbatchhash_ffi.so "$bundle/"
          test -f "$bundle/libbatchhash_ffi.so"
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/BatchHash-linux.tar.gz -C app/build/linux/x64/release/bundle .
          tar -tzf dist/BatchHash-linux.tar.gz | grep 'lib/libbatchhash_ffi.so'
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: batchhash-linux-release
          path: dist/*
          if-no-files-found: error

  # The only job that may write to the repository: it downloads the artifacts
  # the build jobs uploaded and attaches them to a Release. It runs only for a
  # tag push, so a manual dispatch leaves downloadable artifacts and no Release.
  publish:
    name: Publish GitHub Release
    needs: [android, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          set -e
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
