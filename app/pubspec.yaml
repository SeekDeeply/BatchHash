name: batchhash
description: BatchHash - cross-platform batch file hashing and verification.
publish_to: 'none'
version: 1.7.0+11

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Capped at <1.8.0 on purpose. From 1.8.0 on, harmonization.dart calls
  # Color.toARGB32(), an API that only exists from Flutter 3.27, while the
  # package's own constraint still says flutter >=3.4. CI pins Flutter 3.24.5,
  # so a caret range (or any range admitting 1.8.x) resolves to a version whose
  # test compilation fails with "The method 'toARGB32' isn't defined".
  # 1.7.0 is the last release that uses the older Color.value API.
  dynamic_color: ">=1.7.0 <1.8.0"
  ffi: ^2.1.3
  file_picker: ^8.1.7
  # ZIP packing for log export. 4.x is required for password support: the
  # encoder writes WinZip AES (AE-1/AE-2), which the OS archive tools prompt
  # for, while 3.x could only read encrypted archives.
  archive: ^4.6.0
  # SHA-256 for the optional digest suffix on exported file names.
  crypto: ^3.0.8
  path_provider: ^2.1.4
  # Desktop window sizing. Same trap as dynamic_color above, twice over:
  # 0.6.0 requires Flutter >=3.47 outright, and 0.5.x declares flutter >=3.3.0
  # yet calls Color.withValues() in virtual_window_frame.dart, an API that only
  # exists from Flutter 3.27. CI pins 3.24.5, so anything from 0.5.0 on fails to
  # compile with "The method 'withValues' isn't defined". 0.4.3 is the newest
  # release that still builds there and covers the plain resize/persist API.
  window_manager: ">=0.4.0 <0.5.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
