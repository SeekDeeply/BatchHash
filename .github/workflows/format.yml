name: Format (CI)

# CI is the only place formatting runs. Dispatch this workflow, download the
# "formatted-sources" artifact, and apply it to the repository. This keeps local
# machines build-free while still enforcing rustfmt/dart format in CI.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@d92bbbb03544f480ed5c7ba4b54020e4ed2c4f65 # 1.89.0
        with:
          components: rustfmt
      - name: Refresh the lockfile
        run: cargo generate-lockfile
      - name: Rust format
        run: cargo fmt --all
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned, not "stable": this workflow rewrites app/lib and app/test, and
          # a different SDK formats them differently, so the artifact would
          # silently disagree with what CI verifies.
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Dart format
        shell: bash
        run: |
          if [ -f app/pubspec.yaml ]; then
            dart format app/lib app/test
          else
            echo "no Flutter app yet; skipping dart format"
          fi
      - name: Package formatted sources
        shell: bash
        run: |
          FILES="Cargo.toml Cargo.lock rust-toolchain.toml crates"
          if [ -f app/pubspec.yaml ]; then
            FILES="$FILES app/lib app/test app/pubspec.yaml app/analysis_options.yaml"
          fi
          tar -czf formatted-sources.tar.gz $FILES
          tar -tzf formatted-sources.tar.gz > listing.txt
          head -20 listing.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formatted-sources
          path: formatted-sources.tar.gz
          if-no-files-found: error
